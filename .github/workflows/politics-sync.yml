name: Politics podcast sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without editing the playlist
        type: boolean
        default: true
      full_scan:
        description: Check the entire back catalog
        type: boolean
        default: true
  schedule:
    # Check every 15 minutes, at :07, :22, :37 and :52 each hour.
    - cron: '7 0,6,12,18 * * *'
    - cron: '7 1-5,7-11,13-17,19-23 * * *'
    - cron: '22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: politics-podcast-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync politics podcasts
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
          FULL_SCAN: ${{ inputs.full_scan }}
        shell: bash
        run: |
          if [[ -z "$SPOTIFY_CLIENT_ID" || -z "$SPOTIFY_REFRESH_TOKEN" ]]; then
            echo 'Spotify is not connected. Add the two secrets described in README.md.'
            exit 1
          fi
          args=()
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$DRY_RUN" == 'true' ]]; then
            args+=(--dry-run)
          fi
          # The first scheduled run every six hours scans all historical episodes.
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$FULL_SCAN" == 'true' ]] || \
             [[ "$EVENT_SCHEDULE" == '7 0,6,12,18 * * *' ]]; then
            args+=(--full)
          fi
          python politics_sync.py "${args[@]}"
