name: Politics podcast sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview counts and ordering without editing Spotify
        type: boolean
        default: true
      verify_only:
        description: Read-only full audit of membership and ordering
        type: boolean
        default: false
  schedule:
    - cron: '9,24,39,54 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/politics-sync.yml'
      - 'verified_sync.py'
      - 'playlist_sort.py'
      - 'spotify_http.py'
      - 'podcast_config.json'
      - 'test_*.py'

permissions:
  contents: read

concurrency:
  group: political-podcats-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache includes timestamps only and is automatically scoped to this repository.
      - name: Restore Spotify cooldown status
        uses: actions/cache/restore@v4
        with:
          path: .spotify-run-state.json
          key: spotify-cooldown-${{ github.run_id }}
          restore-keys: spotify-cooldown-
      - name: Check whether Spotify has allowed another request
        id: cooldown
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os, time
          from pathlib import Path
          path = Path('.spotify-run-state.json')
          try:
              state = json.loads(path.read_text()) if path.exists() else {}
              if not isinstance(state, dict):
                  state = {}
          except (OSError, ValueError):
              state = {}
          remaining = int(state.get('cooldown_until', 0)) - int(time.time())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"skip={'true' if remaining > 0 else 'false'}\n")
          if remaining > 0:
              print(f'Spotify cooldown: safely deferring sync for approximately {remaining} seconds.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(f'## Spotify rate-limit cooldown\n\nSync deferred for ~{remaining} seconds. No playlist changes were attempted.\n')
          PYCODE
      - name: Test synchronization, ordering, and rate-limit safeguards
        if: steps.cooldown.outputs.skip != 'true'
        run: python -m unittest -v
      - name: Sync, sort, and independently verify saved playlist
        if: steps.cooldown.outputs.skip != 'true'
        env:
          SPOTIFY_STATE_FILE: .spotify-run-state.json
          SPOTIFY_CLIENT_ID: '08d9092293aa43f398d569b4aec930eb'
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        shell: bash
        run: |
          args=(--sort)
          if [[ "$VERIFY_ONLY" == 'true' ]]; then
            args+=(--verify-only)
          elif [[ "$DRY_RUN" == 'true' ]]; then
            args+=(--dry-run)
          fi
          python verified_sync.py "${args[@]}"

      - name: Save Spotify cooldown across workflow runs
        if: ${{ always() && steps.cooldown.outputs.skip != 'true' && hashFiles('.spotify-run-state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .spotify-run-state.json
          key: spotify-cooldown-${{ github.run_id }}
